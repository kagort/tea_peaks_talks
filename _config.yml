title: "Чай, горы, разговоры"
description: "Личные заметки"
url: "https://kagort.github.io"
baseurl: "/tea_peaks_talks"

theme: minima

# Простые настройки minima
minima:
  skin: classic
  date_format: "%d.%m.%Y"
  show_excerpts: true

# Плагины
plugins:
  - jekyll-feed
  - jekyll-seo-tag

permalink: /:year/:month/:day/:title.html

# Коллекция сортов чая раздела "Чайный путь" (каждый сорт из прайса ПЧК —
# отдельная страница; permalink у каждого документа задан явно во front matter)
collections:
  chay_teas:
    output: true
    permalink: /chay/teas/:path/

# Явный список страниц в верхнем меню (minima иначе покажет вообще все
# page.title из site.pages, включая служебные подстраницы /chay/*)
header_pages:
  - about.md
  - categories.md
  - chay/index.md

# Sass настройки должны быть в корне, не внутри exclude
sass:
  sass_dir: assets/css

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - assets/images/source/  # если будете хранить исходники
  - _includes