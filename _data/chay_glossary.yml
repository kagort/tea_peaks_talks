# Глоссарий раздела "Чайный путь".
# Добавляйте термины по алфавиту (сортировка в chay/glossary.md всё равно пересортирует).
# slug используется как id якоря для ссылок вида /chay/glossary/#slug

- slug: maocha
  term: "Маоча (毛茶)"
  definition: >
    Высушенный на солнце необработанный чайный лист — исходное сырьё для прессовки пуэра.

- slug: sheng
  term: "Шэн пуэр (生普)"
  definition: >
    Пуэр естественной ферментации («сырой»). Прессуется из маоча без ускоренной
    постферментации и вызревает естественным образом годами и десятилетиями.

- slug: shu
  term: "Шу пуэр (熟普)"
  definition: >
    Пуэр искусственной ферментации («варёный», «готовый»). Проходит технологию
    во-дуй (握堆) — ускоренное компостирование листа, — что даёт тёмный настой
    и мягкий вкус уже в молодом возрасте.
